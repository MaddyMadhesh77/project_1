<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" font-family="Arial, Helvetica, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 8 6" refX="7" refY="3" markerWidth="8" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L8,3 L0,6 z" fill="#475569"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1600" height="900" fill="#f8f9fb"/>

  <!-- Title -->
  <text x="800" y="34" text-anchor="middle" font-size="24" font-weight="700" fill="#111827">RecoverMem — System Architecture</text>
  <text x="800" y="56" text-anchor="middle" font-size="14" fill="#6b7280">Security middleware between an LLM agent and its long-term memory store</text>

  <!-- Section labels (rotated, left margin per tier band; centers spaced to avoid overlap) -->
  <text x="14" y="110" font-size="10.5" font-weight="700" fill="#9ca3af" letter-spacing="1" transform="rotate(-90 14 110)" text-anchor="middle">PIPELINE</text>
  <text x="14" y="265" font-size="10.5" font-weight="700" fill="#9ca3af" letter-spacing="1" transform="rotate(-90 14 265)" text-anchor="middle">STORAGE &amp; SECURITY</text>
  <text x="14" y="430" font-size="10.5" font-weight="700" fill="#9ca3af" letter-spacing="1" transform="rotate(-90 14 430)" text-anchor="middle">PRESENTATION</text>
  <text x="14" y="570" font-size="10.5" font-weight="700" fill="#9ca3af" letter-spacing="1" transform="rotate(-90 14 570)" text-anchor="middle">RECOVERY</text>

  <!-- ===================== TIER 1: Ingestion Pipeline ===================== -->
  <!-- 1. User -->
  <rect x="40" y="80" width="176" height="60" rx="8" fill="#ccfbf1" stroke="#0f766e" stroke-width="1.5"/>
  <text x="128" y="106" text-anchor="middle" font-size="13" font-weight="700" fill="#0f766e">User</text>
  <text x="128" y="122" text-anchor="middle" font-size="11" fill="#0f766e">(chat, end user)</text>

  <!-- 2. Chat API -->
  <rect x="232" y="80" width="176" height="60" rx="8" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.5"/>
  <text x="320" y="106" text-anchor="middle" font-size="13" font-weight="700" fill="#1e3a8a">Chat API</text>
  <text x="320" y="122" text-anchor="middle" font-size="11" fill="#1e3a8a">POST /chat</text>

  <!-- 3. LLM Client -->
  <rect x="424" y="80" width="176" height="60" rx="8" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.5"/>
  <text x="512" y="106" text-anchor="middle" font-size="13" font-weight="700" fill="#1e3a8a">LLM Client</text>
  <text x="512" y="122" text-anchor="middle" font-size="11" fill="#1e3a8a">templated / Claude</text>

  <!-- 4. Memory Extractor -->
  <rect x="616" y="80" width="176" height="60" rx="8" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.5"/>
  <text x="704" y="106" text-anchor="middle" font-size="13" font-weight="700" fill="#1e3a8a">Memory Extractor</text>
  <text x="704" y="122" text-anchor="middle" font-size="11" fill="#1e3a8a">rule-based</text>

  <!-- 5. Embedding Service -->
  <rect x="808" y="80" width="176" height="60" rx="8" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.5"/>
  <text x="896" y="106" text-anchor="middle" font-size="13" font-weight="700" fill="#1e3a8a">Embedding Service</text>
  <text x="896" y="122" text-anchor="middle" font-size="11" fill="#1e3a8a">Sentence-BERT (384d)</text>

  <!-- 6. Hybrid Retrieval -->
  <rect x="1000" y="80" width="176" height="60" rx="8" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.5"/>
  <text x="1088" y="106" text-anchor="middle" font-size="13" font-weight="700" fill="#1e3a8a">Hybrid Retrieval</text>
  <text x="1088" y="122" text-anchor="middle" font-size="11" fill="#1e3a8a">pgvector + tsvector (RRF)</text>

  <!-- 7. Feature Engineering -->
  <rect x="1192" y="80" width="176" height="60" rx="8" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.5"/>
  <text x="1280" y="106" text-anchor="middle" font-size="13" font-weight="700" fill="#1e3a8a">Feature Engineering</text>
  <text x="1280" y="122" text-anchor="middle" font-size="11" fill="#1e3a8a">8-dim feature vector</text>

  <!-- 8. Trust Engine -->
  <rect x="1384" y="80" width="176" height="60" rx="8" fill="#e0e7ff" stroke="#4338ca" stroke-width="2"/>
  <text x="1472" y="106" text-anchor="middle" font-size="13" font-weight="700" fill="#3730a3">Trust Engine</text>
  <text x="1472" y="122" text-anchor="middle" font-size="11" fill="#3730a3">rules + RandomForest/SHAP</text>

  <!-- Tier 1 chain arrows -->
  <line x1="216" y1="110" x2="230" y2="110" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="408" y1="110" x2="422" y2="110" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="600" y1="110" x2="614" y2="110" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="792" y1="110" x2="806" y2="110" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="984" y1="110" x2="998" y2="110" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="1176" y1="110" x2="1190" y2="110" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="1368" y1="110" x2="1382" y2="110" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- ===================== TIER 2: Trust Gate -> Versioning ===================== -->
  <!-- 9. Versioning + Provenance -->
  <rect x="650" y="190" width="300" height="55" rx="8" fill="#ede9fe" stroke="#6d28d9" stroke-width="1.5"/>
  <text x="800" y="213" text-anchor="middle" font-size="13" font-weight="700" fill="#5b21b6">Versioning + Provenance</text>
  <text x="800" y="230" text-anchor="middle" font-size="11" fill="#5b21b6">non-destructive; logs trust_events</text>

  <path d="M1472,140 L1472,165 L800,165 L800,190" fill="none" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="1136" y="160" text-anchor="middle" font-size="11" font-style="italic" fill="#374151">trust_score + decision (store / review / reject)</text>

  <!-- ===================== TIER 3: Storage & Security Core ===================== -->
  <!-- 10. PostgreSQL + pgvector (cylinder) -->
  <path d="M200,290 a130,12 0 0 1 260,0 v50 a130,12 0 0 1 -260,0 z" fill="#ede9fe" stroke="#6d28d9" stroke-width="1.5"/>
  <ellipse cx="330" cy="290" rx="130" ry="12" fill="#ede9fe" stroke="#6d28d9" stroke-width="1.5"/>
  <text x="330" y="316" text-anchor="middle" font-size="13" font-weight="700" fill="#5b21b6">PostgreSQL + pgvector</text>
  <text x="330" y="332" text-anchor="middle" font-size="11" fill="#5b21b6">memories, versions, provenance</text>

  <!-- 11. Merkle Tree Service -->
  <rect x="650" y="280" width="260" height="60" rx="8" fill="#ede9fe" stroke="#6d28d9" stroke-width="1.5"/>
  <text x="780" y="306" text-anchor="middle" font-size="13" font-weight="700" fill="#5b21b6">Merkle Tree Service</text>
  <text x="780" y="322" text-anchor="middle" font-size="11" fill="#5b21b6">sha256, tamper-evidence</text>

  <!-- 12. Dependency Graph -->
  <rect x="1100" y="280" width="260" height="60" rx="8" fill="#ede9fe" stroke="#6d28d9" stroke-width="1.5"/>
  <text x="1230" y="306" text-anchor="middle" font-size="13" font-weight="700" fill="#5b21b6">Dependency Graph</text>
  <text x="1230" y="322" text-anchor="middle" font-size="11" fill="#5b21b6">networkx DAG (derived_from)</text>

  <!-- Tier2 -> Tier3 fan arrows -->
  <path d="M800,245 L800,262 L330,262 L330,278" fill="none" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M800,245 L800,278" fill="none" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M800,245 L800,262 L1230,262 L1230,278" fill="none" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- ===================== TIER 4: Presentation ===================== -->
  <!-- 13. Admin Dashboard -->
  <rect x="560" y="400" width="480" height="60" rx="8" fill="#ccfbf1" stroke="#0f766e" stroke-width="1.5"/>
  <text x="800" y="426" text-anchor="middle" font-size="13" font-weight="700" fill="#0f766e">Admin Dashboard</text>
  <text x="800" y="442" text-anchor="middle" font-size="11" fill="#0f766e">memories · graph · integrity · analytics · logs</text>

  <!-- 14. Guide / Admin -->
  <rect x="1120" y="400" width="160" height="60" rx="8" fill="#ccfbf1" stroke="#0f766e" stroke-width="1.5"/>
  <text x="1200" y="426" text-anchor="middle" font-size="13" font-weight="700" fill="#0f766e">Guide / Admin</text>
  <text x="1200" y="442" text-anchor="middle" font-size="11" fill="#0f766e">evaluator</text>

  <line x1="1118" y1="430" x2="1042" y2="430" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="1080" y="420" text-anchor="middle" font-size="10" font-style="italic" fill="#374151">views</text>

  <!-- Tier3 -> Tier4 converge arrows -->
  <path d="M330,340 L330,372 L800,372 L800,398" fill="none" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M780,340 L800,340 L800,398" fill="none" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M1230,340 L1230,372 L800,372" fill="none" stroke="#475569" stroke-width="1.5"/>

  <!-- ===================== TIER 5: Recovery ===================== -->
  <!-- 15. Rollback Engine -->
  <rect x="650" y="540" width="300" height="60" rx="8" fill="#fee2e2" stroke="#b91c1c" stroke-width="1.5"/>
  <text x="800" y="566" text-anchor="middle" font-size="13" font-weight="700" fill="#991b1b">Rollback Engine</text>
  <text x="800" y="582" text-anchor="middle" font-size="11" fill="#991b1b">BFS re-validate: keep / revert / remove</text>

  <line x1="800" y1="460" x2="800" y2="538" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="900" y="502" text-anchor="middle" font-size="11" font-style="italic" fill="#374151">mark poisoned &amp; recover</text>

  <!-- Feedback loop: Rollback -> Dependency Graph (right side) -->
  <path d="M950,555 L1540,555 L1540,310 L1362,310" fill="none" stroke="#b91c1c" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#arrow)"/>
  <text x="1540" y="440" text-anchor="middle" font-size="11" font-style="italic" fill="#991b1b" transform="rotate(-90 1540 440)">reads descendants (BFS)</text>

  <!-- Feedback loop: Rollback -> Versioning (left side) -->
  <path d="M650,555 L60,555 L60,217 L648,217" fill="none" stroke="#b91c1c" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#arrow)"/>
  <text x="60" y="390" text-anchor="middle" font-size="11" font-style="italic" fill="#991b1b" transform="rotate(-90 60 390)">writes new version per node</text>

  <!-- ===================== Legend ===================== -->
  <g transform="translate(40,660)">
    <rect x="0" y="0" width="1520" height="80" rx="8" fill="#ffffff" stroke="#e5e7eb" stroke-width="1"/>
    <text x="16" y="20" font-size="12" font-weight="700" fill="#374151">Legend</text>

    <rect x="16" y="32" width="16" height="16" rx="3" fill="#ccfbf1" stroke="#0f766e"/>
    <text x="38" y="45" font-size="12" fill="#374151">Interface (user / guide facing)</text>

    <rect x="266" y="32" width="16" height="16" rx="3" fill="#dbeafe" stroke="#1d4ed8"/>
    <text x="288" y="45" font-size="12" fill="#374151">Ingestion pipeline</text>

    <rect x="486" y="32" width="16" height="16" rx="3" fill="#e0e7ff" stroke="#4338ca"/>
    <text x="508" y="45" font-size="12" fill="#374151">Trust gate (rules + ML)</text>

    <rect x="726" y="32" width="16" height="16" rx="3" fill="#ede9fe" stroke="#6d28d9"/>
    <text x="748" y="45" font-size="12" fill="#374151">Storage &amp; security core</text>

    <rect x="986" y="32" width="16" height="16" rx="3" fill="#fee2e2" stroke="#b91c1c"/>
    <text x="1008" y="45" font-size="12" fill="#374151">Recovery (rollback)</text>

    <line x1="16" y1="64" x2="46" y2="64" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>
    <text x="54" y="68" font-size="12" fill="#374151">data flow</text>

    <line x1="230" y1="64" x2="260" y2="64" stroke="#b91c1c" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#arrow)"/>
    <text x="268" y="68" font-size="12" fill="#374151">rollback feedback loop</text>
  </g>

  <!-- Footer -->
  <text x="800" y="875" text-anchor="middle" font-size="11" fill="#9ca3af">Two front doors, one backend: the Chat surface never shows security internals; the Admin Dashboard is the guide-facing, fully-instrumented view.</text>
</svg>
