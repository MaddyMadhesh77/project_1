[project]
name = "recovermem-backend"
version = "0.1.0"
description = "RecoverMem backend: trust-scored, versioned, tamper-evident memory middleware."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.30",
    "alembic>=1.14",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "pgvector>=0.3.6",
    "sentence-transformers>=3.3",
    "scikit-learn>=1.5",
    "shap>=0.46",
    "networkx>=3.4",
    "python-multipart>=0.0.12",
    "httpx>=0.27",
    "anthropic>=0.40",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
