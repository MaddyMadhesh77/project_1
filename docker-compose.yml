services:
  postgres:
    image: pgvector/pgvector:pg15
    container_name: recovermem-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-recovermem}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-recovermem}
      POSTGRES_DB: ${POSTGRES_DB:-recovermem}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-recovermem}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
